<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Random Number Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f4f4f4;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      margin-bottom: 20px;
      cursor: pointer;
    }
    #result {
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <button onclick="generateRandom()">Generate Random Number</button>
  <div id="result">Click the button to get a number</div>

  <script>
    const numbers = [1, 2, 3, 4, 8];

    function generateRandom() {
      const randomIndex = Math.floor(Math.random() * numbers.length);
      const randomNumber = numbers[randomIndex];
      document.getElementById('result').textContent = `Random Number: ${randomNumber}`;
    }
  </script>

</body>
</html>
